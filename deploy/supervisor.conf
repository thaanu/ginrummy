; Gin Rummy — Supervisor programs.
;
; Copy to /etc/supervisor/conf.d/ginrummy.conf, then:
;   supervisorctl reread && supervisorctl update

[program:ginrummy-reverb]
process_name=%(program_name)s
command=php /var/www/ginrummy/current/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/ginrummy/current
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/ginrummy/reverb.log
stopwaitsecs=10

[program:ginrummy-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ginrummy/current/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
directory=/var/www/ginrummy/current
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/ginrummy/queue.log
stopwaitsecs=3600

[program:ginrummy-scheduler]
process_name=%(program_name)s
command=php /var/www/ginrummy/current/artisan schedule:work
directory=/var/www/ginrummy/current
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/ginrummy/scheduler.log

[group:ginrummy]
programs=ginrummy-reverb,ginrummy-queue,ginrummy-scheduler

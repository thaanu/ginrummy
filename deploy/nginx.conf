# Gin Rummy — Nginx virtual host.
#
# Serves the Laravel application over HTTPS and proxies the Reverb WebSocket
# endpoint on the same domain, so the browser only ever talks to one origin.
#
# See how-to-deploy.md for the environment variables this expects.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ginrummy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ginrummy.example.com;

    root /var/www/ginrummy/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/ginrummy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ginrummy.example.com/privkey.pem;

    charset utf-8;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Built assets are content hashed, so they can be cached indefinitely.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The WebSocket endpoint Laravel Echo connects to.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Reverb's publishing API is deliberately NOT proxied. The application
    # talks to it over the loopback (REVERB_HOST=127.0.0.1), so exposing
    # /apps/ would only widen the attack surface for no benefit.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
    access_log /var/log/nginx/ginrummy-access.log;
    error_log  /var/log/nginx/ginrummy-error.log error;
}
